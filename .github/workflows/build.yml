name: Build PaddleOCR Windows CPU

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install paddlepaddle==3.2.2 -i https://www.paddlepaddle.org.cn/packages/stable/cpu/
          python -m pip install "chardet<5"
          python -m pip install git+https://github.com/timminator/PaddleX.git@release/3.4-custom
          python -m pip install git+https://github.com/timminator/PaddleOCR-Standalone.git@release/3.4-custom
          python -m pip install nuitka ordered-set zstandard

      - name: Compile with Nuitka
        run: |
          cd "$env:GITHUB_WORKSPACE\PaddleOCR-Standalone\Wrappers\CPU"
          python -m nuitka --jobs=2 --assume-yes-for-downloads wrapper.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: paddleocr-cpu-windows
          path: ${{ github.workspace }}\PaddleOCR-Standalone\Wrappers\CPU\wrapper.dist\
          retention-days: 7